name: SESO CI

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  lint-and-unit:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --quiet pandas numpy pyarrow baostock exchange-calendars akshare tdxdata pytest pyflakes

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile scripts/*.py scripts/tdxdata_patch/*.py

      - name: Static lint (pyflakes)
        run: |
          python -m pyflakes scripts/*.py scripts/tdxdata_patch/*.py

      - name: Unit tests (platform-independent subset)
        run: |
          python -m pytest tests/test_sources.py tests/test_status_schema.py tests/test_baostock_client.py tests/test_stock_code_utils.py -q

