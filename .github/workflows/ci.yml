name: SESO CI

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  lint-and-unit:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --quiet pandas numpy pyarrow baostock exchange-calendars pytest pyflakes

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile scripts/baostock_client.py scripts/sources.py \
            scripts/status_schema.py scripts/collect_stock_status.py scripts/trade_calendar.py

      - name: Static lint (pyflakes)
        run: |
          python -m pyflakes scripts/baostock_client.py scripts/sources.py \
            scripts/status_schema.py scripts/collect_stock_status.py scripts/trade_calendar.py

      - name: Unit tests (platform-independent subset)
        run: |
          python -m pytest tests/test_sources.py tests/test_status_schema.py tests/test_baostock_client.py -q
